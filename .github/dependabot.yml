version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Major updates are not grouped, so each one gets its own PR to test and merge
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Keep @types/node on the Node major used by CI and engines (24)
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    schedule:
      interval: 'weekly'
    # Only propose versions published at least two weeks ago: a compromised
    # release is usually caught within days. Security updates still open at once
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
      - dependency-type: production
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Keeps the pinned action SHAs and their version comments current. Major
    # updates are not grouped, so each one gets its own PR
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    # Same two weeks as npm, for the same reason
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
