version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Major updates are not grouped, so each one gets its own PR to test and merge
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Keep @types/node on the Node major used by CI and engines (24)
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    schedule:
      interval: 'weekly'
    labels:
      - 'mindless: 📦 dependencies'
      - 'problems: security'
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
      - dependency-type: production
