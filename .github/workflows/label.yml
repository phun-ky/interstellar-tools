name: 'Pull Request Labeler'
on:
  - pull_request_target

# Read-only by default; jobs ask for what they need
permissions:
  contents: read

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'phun-ky/interstellar-tools' # The one of the available inputs, visit https://github.com/actions/checkout#readme to find more
          token: ${{ secrets.GH_TOKEN }}
      - id: label-the-PR
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
          configuration-path: '.github/labeler.yml'
