# This is a basic workflow to help you get started with Actions

name: Publish

# Controls when the workflow will run
on:
  pull_request:
    types: [closed]
    branches: ['main']
    paths:
      - '.github/**'
      - 'packages/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - '.npmrc'
      - '.release-it.json'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - '.browserslistrc'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Checkout all branches and tags
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24 # Ships npm 11, which supports trusted publishing (needs >= 11.5.1)
      - name: Install dependencies
        run: | # Install and link dependencies
          npm ci
      - name: 'Release' # Interesting step
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          npm run release
        env: # npm authenticates via trusted publishing (id-token: write), no token needed
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Check sibling ranges # All packages are released, so ranges must match now
        run: npm run check:sibling-ranges
  notify:
    name: Notify failed build
    needs: publish
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: drivendataorg/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: build failed'
