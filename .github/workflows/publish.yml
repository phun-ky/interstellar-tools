# This is a basic workflow to help you get started with Actions

name: Publish

# Controls when the workflow will run
on:
  pull_request:
    types: [closed]
    branches: ['main']
    paths:
      - '.github/**'
      - 'packages/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - '.npmrc'
      - '.release-it.json'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - '.browserslistrc'
  workflow_dispatch:

# Read-only by default; only the publish job gets an OIDC token for npm
permissions:
  contents: read
jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Checkout all branches and tags
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # Ships npm 11, which supports trusted publishing (needs >= 11.5.1)
      - name: Install dependencies
        run: | # Install and link dependencies
          npm ci
      - name: Audit runtime dependencies # No release with a known high or critical vulnerability
        run: npm audit --omit=dev --audit-level=high
      - name: Remember existing tags
        run: |
          git tag --list '@interstellar-tools/*' | sort > "$RUNNER_TEMP/tags-before"
      - name: 'Release' # Interesting step
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          npm run release
        env: # npm authenticates via trusted publishing (id-token: write), no token needed
          ACTOR: ${{ github.actor }} # via env, never interpolated into the script
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Attach SBOMs to the new releases # CycloneDX, runtime dependencies only
        run: |
          git tag --list '@interstellar-tools/*' | sort > "$RUNNER_TEMP/tags-after"
          comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after" | while read -r tag; do
            name="${tag#@interstellar-tools/}"
            name="${name%@*}"
            file="$RUNNER_TEMP/${name}-${tag##*@}.cdx.json"
            node scripts/sbom.mjs "$name" > "$file"
            gh release upload "$tag" "$file" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Check sibling ranges # All packages are released, so ranges must match now
        run: npm run check:sibling-ranges
  notify:
    name: Notify failed build
    needs: publish
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: build failed'
